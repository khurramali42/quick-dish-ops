name: Capture application screenshots

# Manual developer tool only. Original verified screenshots are already checked in.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install and build
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Install browser
        run: npx --yes playwright@1.56.1 install --with-deps chromium
      - name: Start demo server
        run: |
          PORT=3000 bun run start > /tmp/quick-dish-server.log 2>&1 &
          for n in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3000/ -o /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/quick-dish-server.log
          exit 1
      - name: Capture original UI
        run: |
          mkdir -p docs/screenshots
          npx --yes playwright@1.56.1 screenshot --browser chromium --viewport-size "1440,900" --wait-for-timeout 3500 http://127.0.0.1:3000/ docs/screenshots/dashboard.png
          npx --yes playwright@1.56.1 screenshot --browser chromium --viewport-size "1600,1000" --wait-for-timeout 3500 http://127.0.0.1:3000/pos docs/screenshots/pos.png
          npx --yes playwright@1.56.1 screenshot --browser chromium --viewport-size "1440,900" --wait-for-timeout 3500 http://127.0.0.1:3000/orders docs/screenshots/orders.png
          test -s docs/screenshots/dashboard.png
          test -s docs/screenshots/pos.png
          test -s docs/screenshots/orders.png
      - uses: actions/upload-artifact@v6
        with:
          name: actual-application-screenshots
          path: docs/screenshots/*.png
      - name: Show server logs on failure
        if: failure()
        run: cat /tmp/quick-dish-server.log || true
