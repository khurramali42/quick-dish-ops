name: Source checks and application build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Check legacy branding is absent
        run: |
          if grep -RniE 'lovable|lovable[.]dev' \
              --include='*.ts' --include='*.tsx' --include='*.json' \
              --include='*.toml' --include='*.md' --include='*.lock' \
              --exclude-dir=.git .; then
            echo 'Unexpected old branding reference in source'
            exit 1
          fi
          test -f public/favicon.svg
          test ! -f public/favicon.ico
      - name: Public source safety checks
        run: |
          if git ls-files | grep -Ei '(^|/)(\.env($|\.)|backups/|exports/|[^/]+\.(pem|p12|pfx|sqlite3?|db|sql)$)'; then
            echo "Sensitive file type tracked in repository"
            exit 1
          fi
          if grep -RniE '(ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}|sb_secret_[A-Za-z0-9_-]{12,}|sk_live_[A-Za-z0-9]{12,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' \
              src docs scripts public --include='*.ts' --include='*.tsx' --include='*.js' --include='*.md' --include='*.json' --include='*.svg'; then
            echo "Potential credential in tracked project files"
            exit 1
          fi
          test ! -e docs/mockups/overview-device-mockup.png
      - name: Confirm required public repository documents
        run: |
          for file in README.md LICENSE SECURITY.md CONTRIBUTING.md THIRD_PARTY_NOTICES.md; do
            test -s "$file"
          done
      - name: Audit tracked and historical high-confidence secrets
        run: python3 scripts/audit-public-history.py
      - name: Install from checked-in lockfile
        run: bun install --frozen-lockfile
      - name: Test checkout, stock and refunds
        run: bun test
      - name: Build application
        run: bun run build
